<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrousel Hero</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/sergioStyles.css">
</head>

<body>

    <main>
        <section class="carrousel">
            <div class="carrousel-elements-div" id="carrousel">

                <div class="carrousel-item carrousel-item-one" id="c-element-one">
                    <div class="carrousel-body" >
                        
                        <p>EL LUGAR DONDE LAS IDEAS CRECEN</p>
                        <h1>Deja el café de casa. <br> Únete a nuestra comunidad.</h1>
                        <button> RESERVAR</button>
                    </div>
                </div>
                
                <div class="carrousel-item carrousel-item-two" id="c-element-two">
                    <div class="carrousel-body" >
                        <p>AMBIENTES QUE INSPIRAN</p>
                        <h1>Salas privadas y espacios<br>abiertos para colaborar.</h1>
                        <button>VER ESPACIOS</button>
                    </div>
                </div>

                <div class="carrousel-item carrousel-item-three" id="c-element-three">
                    <div class="carrousel-body">
                        <p>NETWORKING REAL</p>
                        <h1>Conecta con profesionales<br>que piensan como tú.</h1>
                        <button>CONOCER MÁS</button>
                    </div>
                </div>

            </div>
            <div class="carrousel-controllers">
                <div class="next-buttons-div">
                    
                    <button class="next-button" id="prev"><</button>
                    <button class="next-button" id="next">></button>
                
                </div>
                <div class="select-buttons-div">
                    <button class="circle-button" id="circle-one"></button>
                    <button class="circle-button" id="circle-two"></button>
                    <button class="circle-button" id="circle-three"></button>
                </div>
            </div>
        </section>

    </main>
    <script src="./assets/js/SergioMuñoz.js"></script>

</body>

</html>
