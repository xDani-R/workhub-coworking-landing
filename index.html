<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/styleNacho.css">
</head>
<body>
    <section class="seccionFormulario d-flex justify-content-center flex-column align-items-center pt-5">

        <h2 class="tituloReservas d-flex mb-3">Reservas</h2>

        <form action="" class="w-100 d-flex justify-content-center flex-column align-items-center gap-2">

            <!-- Campo nombre y apellido -->
            <div class="d-flex flex-column inputFormulario">
                <div class="mb-3">
                <input type="text" class="form-control" id="nombreYapellido" placeholder="Nombre y apellido">
                </div>
            </div>

            <!-- Campo email -->
            <div class="d-flex flex-column inputFormulario">
                <div class="mb-3">
                <input type="email" class="form-control" id="email" placeholder="Email">
                </div>
            </div>

            <!-- Campo teléfono -->
            <div class="d-flex flex-column inputFormulario">
                <div class="mb-3">
                <input type="tel" class="form-control" id="telefono" placeholder="Teléfono">
                </div>
            </div>

            <!-- Campo tipo de espacio -->
            <div class="d-flex flex-column inputFormulario">
                <div class="mb-3">
                <select name="tipoEspacio" id="tipoEspacio" class="form-control">
                    <option value="compartida">Sala compartida</option>
                    <option value="privada">Sala privada</option>
                    <option value="taller">Sala taller</option>
                </select>
                </div>
            </div>

            <!-- Campo ubicación y fecha -->
            <div class="d-flex flex-row inputFormulario gap-2">

                <div class="mb-3 flex-fill inputUbicacionFecha" >
                    <select name="ubicacion" id="ubicacion"  class="form-control">
                        <option value="" disabled selected>Ubicación</option>
                        <option value="ubi1">Ubicación 1</option>
                        <option value="ubi2">Ubicación 2</option>
                        <option value="ubi3">Ubicación 3</option>
                    </select>
                </div>

                <div class="mb-3 flex-fill inputUbicacionFecha">
                    <input type="date" class="form-control" id="fecha" placeholder="Fecha">
                </div>
            </div>

            <!-- Campo mensaje -->

            <div class="d-flex flex-column inputFormulario">
                <div class="mb-3">
                    <textarea name="mensaje" id="mensaje" class="form-control" placeholder="Mensaje"></textarea>
                </div>
            </div>

            <button class="botonFormulario">Reservar</button>

        </form>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
